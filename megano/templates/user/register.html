{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="Section Section_column Section_columnLeft">
      <div class="wrap">
        <div class="Section-column">
          <div class="Section-columnSection">
            <header class="Section-header">
              <strong class="Section-title">NAVIGATION
              </strong>
            </header>
            <div class="Section-columnContent">
              <div class="NavigateProfile">
                <ul class="menu menu_vt">
                  <li class="menu-item_ACTIVE menu-item"><a class="menu-link" href="{% url 'login' %}">Login</a>
                  </li>
                  <li class="menu-item"><a class="menu-link" href="{% url 'registration' %}">Registration</a>
                  </li>

                </ul>
              </div>
            </div>
          </div>
        </div>
        <div class="Section-content">
          <div class="Profile">
            <form class="form Profile-form" action="#" method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="row">
                <div class="row-block">
                  <div class="form-group">
                    <label class="form-label" for="avatar">Avatar
                    </label>
                    <div class="Profile-avatar Profile-avatar_noimg">
                      <div class="Profile-img"><img src="" alt="#.png">
                      </div>
                      <label class="Profile-fileLabel" for="avatar">Choise avatar
                      </label>
                      <input class="Profile-file form-input" id="avatar" name="avatar" type="file" accept="image/*" data-validate="onlyImgAvatar"/>
                    </div>
                  </div>
                  <div class="form-group">
                    <label class="form-label" for="id_name">Full name
                    </label>
                    <input class="form-input" id="id_name" name="name" type="text" value="" data-validate="require"/>
                  </div>
                </div>
                <div class="row-block">
                  <div class="form-group">
                    <label class="form-label" for="id_phone">Phone
                    </label>
                    <input class="form-input" id="id_phone" name="phone" type="text" value="+70000000000"/>
                  </div>
                  <div class="form-group">
                    <label class="form-label" for="id_email">E-mail
                    </label>
                    <input class="form-input" id="id_email" name="email" type="text" value="send@test.test" data-validate="require"/>
                  </div>
                  <div class="form-group">
                    <label class="form-label" for="id_password1">Password
                    </label>
                    <input class="form-input" id="id_password1" name="password1" type="password" placeholder="Enter password"/>
                  </div>
                  <div class="form-group">
                    <label class="form-label" for="id_password2">Password confirmation
                    </label>
                    <input class="form-input" id="id_password2" name="password2" type="password" placeholder="Enter password again"/>
                  </div>
                </div>
              </div>
                <div class="form-group">
                    <div class="Profile-errors">
                      <p></p>
                      {% if errors %}
                        <h3>Registrartion unsuccess</h3>
                        {{ errors|safe }}
                      {% endif %}
                    </div>
                  </div>
                <div class="Profile-btn">
                    <button class="btn btn_success" type="submit">Register
                      </button>
                </div>
            </form>
          </div>
        </div>
      </div>
    </div>
{% endblock content %}
